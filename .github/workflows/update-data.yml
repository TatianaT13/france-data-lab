name: Update data (daily)

on:
  schedule:
    - cron: "0 5 * * *" # tous les jours à 5h UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily extraction scripts
        run: |
          python -m src.extract.build_chomage
          python -m src.extract.build_energie
          python -m src.extract.build_air

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ website/data/
          git diff --cached --quiet || git commit -m "chore: update data (daily) [automated]"
          git pull --rebase
          git push
