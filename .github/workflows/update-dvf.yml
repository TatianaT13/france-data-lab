name: Update DVF data (weekly)

on:
  schedule:
    - cron: "0 6 * * 1" # tous les lundis à 6h UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DVF extraction (toutes les années publiées)
        run: python -m src.extract.build_dataset

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ website/data/
          git diff --cached --quiet || git commit -m "chore: update DVF data [automated]"
          git pull --rebase
          git push
